[project]
name = "falling-midi-trainer"
version = "0.1.0"
description = "Interactive MIDI trainer with falling bars visualization and MIDI duplication"
authors = [{ name = "Unknown" }]
requires-python = ">=3.11"
dependencies = [
  "mido",
  "pygame",
  "python-rtmidi",
  "pedalboard>=0.9.26",
  "sounddevice>=0.5.6",
  "numpy",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.scripts]
falling-midi-trainer = "falling_midi_trainer.app:main"
